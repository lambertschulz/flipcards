name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: |
          pnpm dlx @lhci/cli@0.14.x autorun \
            --collect.staticDistDir=./dist \
            --collect.numberOfRuns=1 \
            --collect.settings.preset=mobile \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.categories:performance="warn:0.9" \
            --assert.assertions.categories:accessibility="warn:0.9" \
            --assert.assertions.categories:best-practices="warn:0.9" \
            --upload.target=temporary-public-storage
        continue-on-error: true
