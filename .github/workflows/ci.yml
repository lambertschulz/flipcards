name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  bundle-size:
    name: Bundle-size report (non-blocking)
    runs-on: ubuntu-latest
    needs: checks
    # ADR-0017: budgets are observability, not gates. Failure here must not block merges.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      # On pull requests: andresz1/size-limit-action builds the PR and the base
      # branch, then posts a PR comment with the gzipped size and delta against
      # main. The action treats `size-limit` exit codes as failures by default;
      # `continue-on-error` above keeps an over-budget bundle from blocking the PR.
      - name: size-limit (PR — comment with delta)
        if: github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          build_script: build
          script: size

      # On pushes to main: no PR to comment on, just print the report into the
      # job log so the value is auditable post-merge.
      - name: size-limit (push — log only)
        if: github.event_name != 'pull_request'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm size
